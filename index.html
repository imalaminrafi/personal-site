  <!-- ── PWA: Safe Area CSS for notched phones ── -->
  <style>
    :root {
      --sat: env(safe-area-inset-top);
      --sar: env(safe-area-inset-right);
      --sab: env(safe-area-inset-bottom);
      --sal: env(safe-area-inset-left);
    }
    body {
      /* Prevent rubber-band overscroll on iOS */
      overscroll-behavior: none;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Safety net: if the JS bundle fails to boot, show a message instead of a blank white screen. -->
  <script>
    (function () {
      var shown = false;
      function show() {
        if (shown) return;
        shown = true;
        var root = document.getElementById('root');
        if (!root || root.childElementCount > 0) return;
        root.innerHTML =
          '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;color:#18181b;font-family:system-ui,sans-serif;padding:24px;text-align:center">' +
          '<div><p style="font-size:18px;font-weight:600;margin:0 0 8px">Something went wrong loading the app.</p>' +
          '<p style="font-size:14px;color:#71717a;margin:0 0 16px">Please try refreshing the page.</p>' +
           '<button onclick="location.reload()" style="background:#C9A84C;color:#0F172A;border:0;border-radius:12px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer">Reload page</button></div></div>';
      }
      window.addEventListener('error', show);
      window.addEventListener('unhandledrejection', show);
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.childElementCount === 0) show();
      }, 8000);
    })();
  </script>

  <!-- ── PWA: Service Worker Registration ── -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('/sw.js', { scope: '/' })
          .then(reg => console.log('[PWA] SW registered:', reg.scope))
          .catch(err => console.warn('[PWA] SW registration failed:', err));
      });
    }
  </script>
</body>

</html>
